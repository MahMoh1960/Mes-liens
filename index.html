<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mes Liens</title>
<style>
:root{--bg:#0B1B3A;--card:#12264d;--card2:#183163;--y:#FFD60A;--t:#F4F1E6;--m:#9fb0d0;--line:#243a6b;--danger:#ff6b6b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--t);font-family:system-ui,'Noto Naskh Arabic',sans-serif;font-size:16px;display:flex;flex-direction:column}
header{padding:8px 12px 4px;background:var(--bg);position:sticky;top:0;z-index:5}
.top{display:flex;align-items:center;gap:8px}
h1{flex:1;margin:0;font-size:22px;color:var(--y)}
.ib{background:var(--card);border:1px solid var(--line);color:var(--y);border-radius:12px;min-width:42px;height:42px;font-size:16px;font-weight:700}
.search{width:100%;margin-top:7px;padding:9px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--t);font-size:16px}
.vt{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:6px;color:var(--m);font-size:12px}
.vt .seg{display:flex}
.vt button{padding:5px 12px;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--t)}
.vt button:first-child{border-radius:10px 0 0 10px}
.vt button:last-child{border-radius:0 10px 10px 0}
[dir=rtl] .vt button:first-child{border-radius:0 10px 10px 0}
[dir=rtl] .vt button:last-child{border-radius:10px 0 0 10px}
.vt button.on{background:var(--y);color:#0B1B3A;border-color:var(--y);font-weight:700}
.approw.sel{border-color:var(--y);background:var(--card2)}
.chk{font-size:20px;color:var(--y);flex:none}
#ovApps .btns{position:sticky;bottom:-16px;background:var(--bg);padding:10px 0 4px;margin-top:8px}
.approw{display:flex;align-items:center;gap:12px;padding:8px 12px}
.approw img{width:36px;height:36px;border-radius:8px;flex:none}
.chips{display:flex;gap:6px;overflow-x:auto;padding:7px 0 3px}
.chip{flex:none;padding:5px 13px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--t);font-size:14px}
.chip.on{background:var(--y);color:#0B1B3A;border-color:var(--y);font-weight:700}
.bar{display:flex;align-items:center;justify-content:space-between;color:var(--m);font-size:12px;padding-top:2px}
select,input,textarea{font-family:inherit}
.sort{background:var(--card);color:var(--t);border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-size:13px}
main{flex:1;overflow-y:auto;padding:2px 10px 90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px 6px 4px 8px;margin:3px 0}
.row{display:flex;gap:8px;align-items:center}
.badge{flex:none;width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;border:1px solid var(--line)}
.main{flex:1;min-width:0}
.title{font-weight:700;font-size:15px;line-height:1.3;color:var(--y);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.desc{margin-top:4px;color:var(--t);font-size:14px;line-height:1.35;white-space:pre-wrap;word-break:break-word}
.url{margin-top:1px;color:var(--m);font-size:11px;line-height:1.15;direction:ltr;text-align:start;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{margin-top:6px;display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;padding:2px 9px;border-radius:10px;background:var(--card2);color:var(--m)}
.tag.cat{color:var(--y)}
.star{background:none;border:0;color:var(--y);font-size:20px;min-width:34px;height:34px;padding:0}
.cb{background:none;border:0;color:var(--y);font-size:17px;font-weight:700;min-width:34px;height:34px;padding:0}
.acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.acts button{flex:1;min-width:70px;padding:8px 6px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--t);font-size:13px}
.acts button.pri{background:var(--y);color:#0B1B3A;border-color:var(--y);font-weight:700}
.acts button.del{color:var(--danger)}
.acts button[data-a=more]{flex:none;min-width:46px;font-size:18px;font-weight:700}
.det{margin:3px 0 4px;padding-top:6px;border-top:1px solid var(--line)}
.det .desc{margin-top:0}
.empty{text-align:center;color:var(--m);margin-top:60px;line-height:1.6;padding:0 20px}
.fab{position:fixed;inset-inline-end:18px;bottom:calc(18px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:30px;background:var(--y);color:#0B1B3A;border:0;font-size:34px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.5);z-index:6}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:none;align-items:flex-end;justify-content:center}
.ov.show{display:flex}
.sheet{background:var(--bg);border:1px solid var(--line);border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:92%;overflow-y:auto;padding:16px}
.sheet h2{margin:0 0 12px;color:var(--y);font-size:19px}
label{display:block;margin:10px 0 4px;color:var(--m);font-size:13px}
.f{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--t);font-size:16px}
textarea.f{min-height:90px;resize:vertical}
.btns{display:flex;gap:10px;margin-top:16px}
.btns button{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--t);font-size:16px}
.btns button.pri{background:var(--y);color:#0B1B3A;border-color:var(--y);font-weight:700}
.mi{display:block;width:100%;text-align:start;padding:14px;margin:6px 0;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--t);font-size:16px}
.addrow{display:flex;gap:8px;margin-bottom:10px}
.addrow input{flex:1;min-width:0}
.addrow button{padding:0 16px;border-radius:10px;border:1px solid var(--y);background:var(--y);color:#0B1B3A;font-weight:700;font-size:16px}
.crow{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;margin:6px 0;border-radius:10px;background:var(--card)}
.crow button{background:none;border:0;color:var(--danger);font-size:20px}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--y);color:#0B1B3A;padding:10px 18px;border-radius:20px;font-weight:700;z-index:50;display:none;max-width:90%;text-align:center}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1 id="hTitle">Mes Liens</h1>
    <button class="ib" id="bMic">🎤</button>
    <button class="ib" id="bVL">FR</button>
    <button class="ib" id="bLang">ع</button>
    <button class="ib" id="bMenu">⋮</button>
  </div>
  <div class="vt"><span id="vtLab"></span><div class="seg"><button id="vtApp"></button><button id="vtG"></button></div></div>
  <input class="search" id="q" type="search" autocomplete="off">
  <div class="chips" id="chips"></div>
  <div class="bar"><span id="count"></span>
    <select class="sort" id="sort"></select>
  </div>
</header>
<main id="list"></main>
<button class="fab" id="fab">+</button>

<div class="ov" id="ovForm"><div class="sheet">
  <h2 id="fTitle"></h2>
  <button class="mi" type="button" id="fPick"></button>
  <button class="mi" type="button" id="fPickApp"></button>
  <label id="lUrl"></label><input class="f" id="fUrl" inputmode="url" autocapitalize="off" autocomplete="off" style="direction:ltr;text-align:start">
  <label id="lName"></label><input class="f" id="fName">
  <label id="lDesc"></label><textarea class="f" id="fDesc"></textarea>
  <label id="lCat"></label><select class="f" id="fCat"></select>
  <input class="f" id="fNewCat" style="display:none;margin-top:8px">
  <label id="lTags"></label><input class="f" id="fTags">
  <div class="btns"><button id="fCancel"></button><button class="pri" id="fSave"></button></div>
</div></div>

<div class="ov" id="ovMenu"><div class="sheet">
  <h2 id="mTitle"></h2>
  <button class="mi" id="mExport"></button>
  <button class="mi" id="mImport"></button>
  <button class="mi" id="mCats"></button>
  <button class="mi" id="mPin"></button>
  <div class="btns"><button id="mClose"></button></div>
</div></div>

<div class="ov" id="ovImport"><div class="sheet">
  <h2 id="iTitle"></h2>
  <label id="iFileL"></label><input type="file" id="iFile" accept=".json,.txt,application/json,text/plain" class="f">
  <label id="iPasteL"></label><textarea class="f" id="iText" style="direction:ltr"></textarea>
  <div class="btns"><button id="iCancel"></button><button class="pri" id="iGo"></button></div>
</div></div>

<div class="ov" id="ovCats"><div class="sheet">
  <h2 id="cTitle"></h2>
  <div class="addrow"><input class="f" id="cNew" autocomplete="off"><button id="cAdd"></button></div>
  <div id="cList"></div>
  <div class="btns"><button id="cClose"></button></div>
</div></div>

<div class="ov" id="ovMore"><div class="sheet">
  <button class="mi" id="moEdit"></button>
  <button class="mi" id="moCopy"></button>
  <button class="mi" id="moDel" style="color:var(--danger)"></button>
  <div class="btns"><button id="moClose"></button></div>
</div></div>

<div class="ov" id="ovVoice"><div class="sheet">
  <h2 id="vTitle"></h2>
  <div id="vList"></div>
  <div class="btns"><button id="vClose"></button></div>
</div></div>

<div class="ov" id="ovApps"><div class="sheet">
  <h2 id="aTitle"></h2>
  <div class="addrow"><input class="f" id="aSearch" type="search" autocomplete="off"><button id="aAll"></button></div>
  <div id="aList" style="margin-top:8px"></div>
  <div class="btns"><button id="aClose"></button><button class="pri" id="aOk"></button></div>
</div></div>

<div class="ov" id="ovConfirm"><div class="sheet">
  <h2 id="qText"></h2>
  <div class="btns"><button id="qNo"></button><button class="pri" id="qYes"></button></div>
</div></div>

<div id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const DEF_CATS=['Google','X','Facebook','Mobile','Recherche','Thèse','Enseignement','Divers'];
const I18N={
fr:{title:'Mes Liens',search:'Rechercher un lien…',all:'Tous',favs:'★ Favoris',add:'Ajouter un lien',edit:'Modifier le lien',
url:'Adresse (URL)',name:'Titre',desc:'De quoi s’agit-il ?',cat:'Catégorie',newcat:'+ Nouvelle catégorie…',newcatph:'Nom de la catégorie',tags:'Étiquettes (séparées par des virgules)',
save:'Enregistrer',cancel:'Annuler',open:'Ouvrir',copy:'Copier',del:'Supprimer',delq:'Supprimer ce lien ?',yes:'Oui',no:'Non',
copied:'Lien copié',saved:'Enregistré',deleted:'Supprimé',invalid:'Adresse invalide',dup:'Ce lien existe déjà',
empty:'Aucun lien pour le moment.<br>Appuyez sur + ou utilisez « Partager » depuis une autre application.',
sRecent:'Plus récents',sAlpha:'A → Z',sCat:'Par catégorie',menu:'Menu',export:'Exporter (sauvegarde)',import:'Importer une sauvegarde',cats:'Gérer les catégories',
pick:'📁 Choisir des fichiers du téléphone',unpick:'🌐 Utiliser plutôt une adresse web',det:'De quoi s’agit-il ?',editBtn:'Modifier',vMany:'Plusieurs liens trouvés pour',pickApp:'📲 Choisir des applications du téléphone',dupN:'déjà présent(s)',appSearch:'Rechercher une application…',vtLab:'🎤 Chercher dans :',vtApp:'📱 Mes liens',vtG:'🌐 Google',vNone:'Aucun lien trouvé pour',vSearch:'🎤 Recherche Google : ',voiceFail:'Rien entendu, réessayez',voiceNA:'Voix indisponible',pin:'🎤 Raccourci vocal sur l’écran d’accueil',catNewPh:'Nom de la nouvelle catégorie',catAdd:'Ajouter',catExists:'Cette catégorie existe déjà',close:'Fermer',importTitle:'Importer',chooseFile:'Choisir un fichier',paste:'… ou coller le contenu ici',go:'Importer',imported:'lien(s) ajouté(s)',bad:'Fichier non valide',
links:'lien(s)',catDelq:'Supprimer cette catégorie ? Ses liens passeront dans « Divers ».'},
ar:{title:'روابطي',search:'ابحث عن رابط…',all:'الكل',favs:'★ المفضلة',add:'إضافة رابط',edit:'تعديل الرابط',
url:'العنوان (URL)',name:'العنوان',desc:'ما هو موضوعه؟',cat:'الفئة',newcat:'+ فئة جديدة…',newcatph:'اسم الفئة',tags:'وسوم (مفصولة بفواصل)',
save:'حفظ',cancel:'إلغاء',open:'فتح',copy:'نسخ',del:'حذف',delq:'هل تريد حذف هذا الرابط؟',yes:'نعم',no:'لا',
copied:'تم نسخ الرابط',saved:'تم الحفظ',deleted:'تم الحذف',invalid:'عنوان غير صالح',dup:'هذا الرابط موجود مسبقاً',
empty:'لا توجد روابط حالياً.<br>اضغط + أو استعمل «مشاركة» من تطبيق آخر.',
sRecent:'الأحدث',sAlpha:'أ → ي',sCat:'حسب الفئة',menu:'القائمة',export:'تصدير (نسخة احتياطية)',import:'استيراد نسخة احتياطية',cats:'إدارة الفئات',
pick:'📁 اختيار ملفات من الهاتف',unpick:'🌐 استعمال عنوان ويب بدلاً من ذلك',det:'ما هو موضوعه؟',editBtn:'تعديل',vMany:'عدة روابط لـ',pickApp:'📲 اختيار تطبيقات من الهاتف',dupN:'موجود مسبقاً',appSearch:'ابحث عن تطبيق…',vtLab:'🎤 البحث في:',vtApp:'📱 روابطي',vtG:'🌐 غوغل',vNone:'لا يوجد رابط لـ',vSearch:'🎤 بحث في غوغل: ',voiceFail:'لم أسمع شيئاً، أعد المحاولة',voiceNA:'الصوت غير متاح',pin:'🎤 اختصار صوتي على الشاشة الرئيسية',catNewPh:'اسم الفئة الجديدة',catAdd:'إضافة',catExists:'هذه الفئة موجودة مسبقاً',close:'إغلاق',importTitle:'استيراد',chooseFile:'اختيار ملف',paste:'… أو الصق المحتوى هنا',go:'استيراد',imported:'رابط مضاف',bad:'ملف غير صالح',
links:'رابط',catDelq:'حذف هذه الفئة؟ ستنتقل روابطها إلى «Divers».'}
};
const NETS=[
[/(^|\.)google\./,'Google','G','#4285F4','#fff'],
[/(^|\.)(x|twitter)\.com$/,'X','X','#000','#fff'],
[/(^|\.)(facebook\.com|fb\.com|fb\.watch|fb\.me)$/,'Facebook','f','#1877F2','#fff'],
[/(^|\.)(youtube\.com|youtu\.be)$/,'YouTube','▶','#FF0000','#fff'],
[/(^|\.)instagram\.com$/,'Instagram','◎','#E4405F','#fff'],
[/(^|\.)linkedin\.com$/,'LinkedIn','in','#0A66C2','#fff'],
[/(^|\.)(whatsapp\.com|wa\.me)$/,'WhatsApp','W','#25D366','#fff'],
[/(^|\.)(t\.me|telegram\.org)$/,'Telegram','✈','#26A5E4','#fff'],
[/(^|\.)tiktok\.com$/,'TikTok','♪','#111','#fff'],
[/(^|\.)github\.com$/,'GitHub','GH','#333','#fff'],
[/(^|\.)wikipedia\.org$/,'Wikipedia','W','#eee','#111'],
[/(^|\.)researchgate\.net$/,'ResearchGate','RG','#00CCBB','#fff']
];
const KEY='meslinks_v1';
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.links))return Object.assign({links:[],cats:DEF_CATS.slice(),lang:'fr'},d);}catch(e){}return{links:[],cats:DEF_CATS.slice(),lang:'fr'};}
let S=load();
if(!S.mobileAdded){if(!S.cats.includes('Mobile'))S.cats.splice(Math.min(3,S.cats.length),0,'Mobile');S.mobileAdded=true;save();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const t=k=>(I18N[S.lang]||I18N.fr)[k]||k;
let V={q:'',cat:'',sort:'recent'};
let editing=null,catTouched=false,confirmCb=null,moreId=null,pend=null;
const EXP=new Set();

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function normUrl(u){u=String(u||'').trim();if(!u)return'';if(/^(content|app):\/\//i.test(u))return u;if(!/^[a-z][a-z0-9+.-]*:\/\//i.test(u))u='https://'+u;try{const x=new URL(u);if(!/^https?:$/.test(x.protocol))return'';if(!x.hostname.includes('.'))return'';return x.href;}catch(e){return'';}}
function host(u){if(/^content:/i.test(u))return'';try{return new URL(u).hostname.replace(/^www\./,'');}catch(e){return u;}}
function fileNet(l){
  const m=String(l.mime||'').toLowerCase();
  if(m.startsWith('video/'))return{ab:'🎬',bg:'#7C3AED',fg:'#fff'};
  if(m.startsWith('audio/'))return{ab:'🎵',bg:'#059669',fg:'#fff'};
  if(m.startsWith('image/'))return{ab:'🖼',bg:'#DB2777',fg:'#fff'};
  if(/pdf|epub|text|word|document|mobi/.test(m))return{ab:'📖',bg:'#D97706',fg:'#fff'};
  return{ab:'📄',bg:'#FFD60A',fg:'#0B1B3A'};
}
function appNet(l){return l.icon?{ab:'',bg:'transparent',fg:'#fff'}:{ab:'📲',bg:'#25D366',fg:'#fff'};}
function openLink(l){if(l.app&&window.Android&&Android.openApp)Android.openApp(l.pkg);else if(l.file&&window.Android&&Android.openFile)Android.openFile(l.url,l.mime||'');else openUrl(l.url);}
function net(u){const h=host(u);for(const n of NETS){if(n[0].test(h))return{name:n[1],ab:n[2],bg:n[3],fg:n[4]};}return{name:'',ab:'🌐',bg:'#FFD60A',fg:'#0B1B3A'};}
function toast(m){const e=$('#toast');e.textContent=m;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2000);}
function show(id){$(id).classList.add('show');}
function hide(id){$(id).classList.remove('show');}
function anyOpen(){return document.querySelector('.ov.show');}

function applyLang(){
  document.documentElement.lang=S.lang;document.documentElement.dir=S.lang==='ar'?'rtl':'ltr';
  $('#hTitle').textContent=t('title');$('#bLang').textContent=S.lang==='ar'?'FR':'ع';
  $('#q').placeholder=t('search');
  $('#sort').innerHTML=['recent:sRecent','alpha:sAlpha','cat:sCat'].map(x=>{const[a,b]=x.split(':');return`<option value="${a}"${V.sort===a?' selected':''}>${esc(t(b))}</option>`}).join('');
  $('#lUrl').textContent=t('url');$('#lName').textContent=t('name');$('#lDesc').textContent=t('desc');$('#lCat').textContent=t('cat');$('#lTags').textContent=t('tags');
  $('#fPick').textContent=pend?t('unpick'):t('pick');
  $('#fNewCat').placeholder=t('newcatph');$('#fCancel').textContent=t('cancel');$('#fSave').textContent=t('save');
  $('#mTitle').textContent=t('menu');$('#mExport').textContent=t('export');$('#mImport').textContent=t('import');$('#mCats').textContent=t('cats');$('#mClose').textContent=t('close');
  $('#iTitle').textContent=t('importTitle');$('#iFileL').textContent=t('chooseFile');$('#iPasteL').textContent=t('paste');$('#iCancel').textContent=t('cancel');$('#iGo').textContent=t('go');
  $('#cTitle').textContent=t('cats');$('#cClose').textContent=t('close');$('#cNew').placeholder=t('catNewPh');$('#cAdd').textContent=t('catAdd');
  $('#qNo').textContent=t('no');updVL();$('#fPickApp').textContent=t('pickApp');$('#aTitle').textContent=t('pickApp');$('#aSearch').placeholder=t('appSearch');$('#aClose').textContent=t('close');$('#mPin').textContent=t('pin');$('#vClose').textContent=t('close');$('#qYes').textContent=t('yes');
  $('#moEdit').textContent='✎ '+t('editBtn');$('#moCopy').textContent='⧉ '+t('copy');$('#moDel').textContent='🗑 '+t('del');$('#moClose').textContent=t('close');
}
function render(){
  const chips=[['',t('all')],['★',t('favs')]].concat(S.cats.map(c=>[c,c]));
  $('#chips').innerHTML=chips.map(c=>`<button class="chip${V.cat===c[0]?' on':''}" data-c="${esc(c[0])}">${esc(c[1])}</button>`).join('');
  const q=norm(V.q);
  let L=S.links.filter(l=>{
    if(V.cat==='★'&&!l.fav)return false;
    if(V.cat&&V.cat!=='★'&&l.cat!==V.cat)return false;
    if(!q)return true;
    return norm([l.title,l.desc,l.url,l.cat,(l.tags||[]).join(' ')].join(' ')).includes(q);
  });
  L.sort((a,b)=>{
    if(!!b.fav!==!!a.fav)return b.fav?1:-1;
    if(V.sort==='alpha')return a.title.localeCompare(b.title);
    if(V.sort==='cat')return (a.cat||'').localeCompare(b.cat||'')||a.title.localeCompare(b.title);
    return (b.created||0)-(a.created||0);
  });
  $('#count').textContent=L.length+' '+t('links');
  if(!L.length){$('#list').innerHTML=`<div class="empty">${t('empty')}</div>`;return;}
  $('#list').innerHTML=L.map(l=>{
    const n=l.file?fileNet(l):l.app?appNet(l):net(l.url);
    const hasDet=!!(l.desc||(l.tags||[]).length);
    const op=EXP.has(l.id);
    return`<div class="card" data-id="${l.id}">
<div class="row"><div class="badge" style="background:${n.bg};color:${n.fg}${l.app&&l.icon?';border-color:transparent':''}">${l.app&&l.icon?`<img src="${l.icon}" style="width:32px;height:32px;border-radius:7px">`:esc(n.ab)}</div>
<div class="main" data-a="open"><div class="title">${esc(l.title)}</div></div>
${hasDet?`<button class="cb" data-a="det">${op?'▲':'ℹ'}</button>`:''}<button class="star" data-a="fav">${l.fav?'★':'☆'}</button><button class="cb" data-a="more">⋮</button></div>
${op&&hasDet?`<div class="det">${l.desc?`<div class="desc">${esc(l.desc)}</div>`:''}${(l.tags||[]).length?`<div class="meta">${l.tags.map(x=>`<span class="tag">#${esc(x)}</span>`).join('')}</div>`:''}</div>`:''}</div>`;
  }).join('');
}

function addBulk(items){

// ===== Commande vocale =====
const VNORM=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ًͯ-ٰٟ]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/[^a-z0-9؀-ۿ\s]/g,' ').replace(/\s+/g,' ').trim();
const FILL=new Set(('ouvre ouvrir ouvrez va aller allez sur lance lancer affiche afficher montre montrer mon ma mes le la les l un une du de des lien liens site page fichier application appli moi svp please s il te plait vous plait '+
 'افتح افتحلي افتحي اذهب الى شغل موقع رابط الرابط ملف لي من فضلك '+
 'open go to launch show display visit take find my the a an link links site website page file me please can could would you i want hey').split(' '));
const SEARCH=new Set('cherche chercher recherche rechercher trouve trouver search look ابحث بحث دور'.split(' '));
const SRCFILL=new Set('sur google عن على غوغل جوجل قوقل pour for on in up'.split(' '));
const KNOWN=[
[['google maps','maps','خرائط','خرائط غوغل'],'https://maps.google.com'],
[['google drive','drive','درايف'],'https://drive.google.com'],
[['translate','google translate','traduction','traducteur','ترجمة'],'https://translate.google.com'],
[['google','غوغل','جوجل','قوقل'],'https://www.google.com'],
[['youtube','يوتيوب','يوتوب'],'https://www.youtube.com'],
[['facebook','فيسبوك','فايسبوك','فيس بوك'],'https://www.facebook.com'],
[['x','twitter','تويتر','اكس'],'https://x.com'],
[['instagram','انستغرام','انستجرام','انستا'],'https://www.instagram.com'],
[['whatsapp','واتساب','واتس اب'],'https://web.whatsapp.com'],
[['wikipedia','ويكيبيديا','ويكيبيدا'],'https://www.wikipedia.org'],
[['linkedin','لينكدان','لينكد ان'],'https://www.linkedin.com'],
[['telegram','تيليغرام','تيليجرام'],'https://web.telegram.org'],
[['tiktok','تيك توك','تيكتوك'],'https://www.tiktok.com'],
[['gmail','جيميل'],'https://mail.google.com'],
[['github','جيت هاب'],'https://github.com']
];
const inc=(str,w)=>w.length<3?(' '+str+' ').includes(' '+w+' '):str.includes(w);
function gsearch(q,heard){
  q=String(q||'').trim();if(!q)return false;
  toast(t('vSearch')+q);openUrl('https://www.google.com/search?hl='+vl()+'&q='+encodeURIComponent(q));return true;
}
function pickLink(best,heard,gq){
  if(best.length===1&&!gq){toast('🎤 '+best[0].title);openLink(best[0]);return true;}
  $('#vTitle').textContent=t('vMany')+' « '+heard+' »';
  $('#vList').innerHTML=best.slice(0,12).map(l=>`<button class="mi" data-id="${l.id}">${esc(l.title)}</button>`).join('')+(gq?`<button class="mi" data-g="${esc(gq)}">🔎 Google : ${esc(gq)}</button>`:'');
  show('#ovVoice');return true;
}
function scoreLinks(q){
  const qs=q.join(' ');const out=[];
  S.links.forEach(l=>{
    const ti=VNORM(l.title);
    const hay=VNORM([l.title,l.cat,(l.tags||[]).join(' '),l.desc,(l.file||l.app)?l.fname:host(l.url)].join(' '));
    const sc=ti===qs?4:(inc(ti,qs)||(ti.length>2&&qs.includes(ti)))?3:q.every(w=>inc(ti,w))?2:q.every(w=>inc(hay,w))?1:0;
    if(sc)out.push([sc,l]);
  });
  return out.sort((x,y)=>y[0]-x[0]);
}
function handleVoice(heard){
  const tk=VNORM(heard).split(' ').filter(Boolean);
  if(!tk.length)return false;
  let q,isSearch=SEARCH.has(tk[0]);
  if(isSearch){q=tk.slice(1).filter(w=>!SRCFILL.has(w));if(!q.length)q=tk.slice(1);}
  else{q=tk.filter(w=>!FILL.has(w));if(!q.length)q=tk;}
  if(!q.length)return false;
  const qs=q.join(' ');
  if(vt()==='google'){
    if(!isSearch){
      const site=KNOWN.find(k=>k[0].some(a=>qs===a||(' '+qs+' ').includes(' '+a+' ')));
      if(site){toast('🎤 '+site[0][0]);openUrl(site[1]);return true;}
    }
    return gsearch(qs,heard);
  }
  // Mode « Mes liens » : uniquement dans l'application
  const found=scoreLinks(q);
  if(!found.length)return false;
  const top=found[0][0];
  const list=(isSearch||top<2)?found.map(x=>x[1]):found.filter(x=>x[0]===top).map(x=>x[1]);
  return pickLink(list,heard);
}
window.onVoice=function(arr){
  arr=(arr||[]).map(String).filter(Boolean);
  if(!arr.length){toast(t('voiceFail'));return;}
  for(const h of arr){if(handleVoice(h))return;}
  toast(t('vNone')+' « '+arr[0]+' »');
};
const VL=['fr','ar','en'],VCODE={fr:'fr-FR',ar:'ar-MA',en:'en-US'},VLAB={fr:'FR',ar:'ع',en:'EN'},VNAME={fr:'Français',ar:'العربية',en:'English'};

  hide('#ovVoice');

applyLang();render();
